[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-validator"
version = "0.1.0"
description = "Uma biblioteca de validação para APIs FastAPI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Seu Nome", email = "seu@email.com" }
]
keywords = ["fastapi", "validation", "api", "pydantic", "restful", "analyzer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
fastapi-validator = "fastapi_validator.cli:main"

[project.urls]
Homepage = "https://github.com/seu-usuario/fastapi-validator"
Repository = "https://github.com/seu-usuario/fastapi-validator"
Documentation = "https://github.com/seu-usuario/fastapi-validator#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_validator"]

[tool.hatch.build.targets.wheel.force-include]
"src/fastapi_validator/py.typed" = "fastapi_validator/py.typed"

[tool.fastapi-validator]
# exclude-rules = ["naming-kebab-case", "docs-operation-id"]
# min-severity = "warning"
# fail-on-warning = false
# score = true
# format = "text"
# output = "report.html"

# [tool.fastapi-validator.category-weights]
# security = 0.20
# naming = 0.10
# http = 0.15
# docs = 0.15
# status = 0.10
# response = 0.10
# versioning = 0.10
# pagination = 0.10

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
